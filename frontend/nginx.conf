server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # По умолчанию nginx режет тело на 1 МБ — это противоречило заявленным
    # 20 МБ на загрузку файла во всём остальном стеке.
    client_max_body_size 20m;

    # Токен лежит в localStorage, поэтому любой XSS означал бы угон сессии.
    # CSP запрещает сторонние скрипты; остальные заголовки закрывают
    # кликджекинг и подмену типа содержимого.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://tiles.mapterhorn.com; connect-src 'self' https://tiles.openfreemap.org https://tiles.mapterhorn.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # SPA: любой путь отдаёт index.html, маршрутизацией занимается фронтенд.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксируем API через тот же origin — фронтенд ходит по относительному
    # пути, поэтому ни CORS, ни baseURL на этапе сборки не нужны.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
