apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: hackalem
  labels: { app: api }
spec:
  type: ClusterIP          # наружу — через Ingress, не через LoadBalancer на каждый сервис
  selector:
    app: api
  ports:
    - name: http
      # Порт сервиса совпадает с портом контейнера намеренно: тогда
      # frontend/nginx.conf (proxy_pass http://api:8000) работает без изменений
      # и в docker compose, и в кластере.
      port: 8000
      targetPort: 8000
      protocol: TCP
