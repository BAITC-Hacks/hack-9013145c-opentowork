# Веб-интерфейс: статика React, собранная в образ, раздаётся nginx.
# Тот же контейнер проксирует /api на сервис api — поэтому браузер ходит
# по одному origin и CORS не нужен.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hackalem
  labels: { app: frontend }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: frontend
          image: ghcr.io/OWNER/hackalem-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests: { cpu: "50m", memory: "64Mi" }    # nginx со статикой почти ничего не ест
            limits:   { cpu: "300m", memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hackalem
  labels: { app: frontend }
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
