apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: hackalem
  labels: { app: api }
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # во время деплоя всегда есть живые поды
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/OWNER/hackalem-api:latest   # заменить на свой registry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }   # без requests HPA не работает
            limits:   { cpu: "1000m", memory: "1Gi" }

          # liveness: только «процесс жив». НЕ проверяем БД —
          # иначе просадка БД вызовет каскадный рестарт всех подов.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # readiness: зависимости доступны → можно слать трафик
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # startup: даёт время на миграции при старте, не мешая liveness
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 5

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]   # LB успевает убрать под из ротации

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: hackalem
spec:
  # maxUnavailable, а не minAvailable: 2. HPA может опустить до minReplicas=2,
  # и тогда minAvailable=2 навсегда запретил бы вытеснение пода — узел
  # невозможно было бы вывести на обслуживание.
  maxUnavailable: 1
  selector:
    matchLabels: { app: api }
