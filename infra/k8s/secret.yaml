# ШАБЛОН. Реальные значения сюда НЕ коммитим.
#
# Создавать так:
#   kubectl -n hackalem create secret generic app-secrets \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://app:PASS@postgres:5432/app' \
#     --from-literal=REDIS_URL='redis://redis:6379/0' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=LLM_API_KEY='...' \
#     --from-literal=EMBEDDING_API_KEY='...' \
#     --from-literal=S3_ACCESS_KEY='...' \
#     --from-literal=S3_SECRET_KEY='...'
#
# В проде — External Secrets Operator / Vault / облачный Secret Manager.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: hackalem
type: Opaque
stringData:
  # Пароль в DATABASE_URL и POSTGRES_PASSWORD ОБЯЗАН совпадать: Postgres
  # поднимается со вторым, приложение подключается с первым. Раньше здесь
  # стояли разные значения, и базовый оверлей не поднимался в принципе.
  DATABASE_URL: "postgresql+asyncpg://app:REPLACE_ME@postgres:5432/app"
  POSTGRES_PASSWORD: "REPLACE_ME"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET: "REPLACE_ME"
  LLM_API_KEY: "REPLACE_ME"
  EMBEDDING_API_KEY: "REPLACE_ME"
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "uploads"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
