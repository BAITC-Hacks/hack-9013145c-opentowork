name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  # Интеграционные проверки границ доступа: пользователь A не читает данные
  # пользователя B, кэш не течёт между пользователями. Требуют настоящей базы,
  # поэтому вынесены в отдельную задачу.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: dev
      LLM_MODE: mock
      SEED_ON_START: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrations
        run: alembic upgrade head
      - name: Authz and isolation tests
        run: pytest -q -m integration

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Секреты в истории: дешевле поймать здесь, чем отзывать ключ потом.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pip install pip-audit bandit

      # Известные уязвимости в зависимостях.
      - name: Dependency audit
        run: pip-audit --strict --desc

      # Типовые ошибки безопасности в коде: небезопасные вызовы, слабые
      # алгоритмы, захардкоженные секреты.
      - name: Static analysis
        run: bandit -q -r app -x app/scripts

      # Уязвимости в базовом образе и системных пакетах.
      - name: Build image for scan
        run: docker build -f infra/docker/backend.Dockerfile -t hackalem-api:scan .
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hackalem-api:scan
          severity: HIGH,CRITICAL
          exit-code: "0" # пока не блокируем сборку, но результат виден в логе
          format: table

  build:
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t hackalem-api:${{ github.sha }} .

      # Фронтенд раньше не собирался в CI вообще — поломка вёрстки доезжала
      # до развёртывания незамеченной.
      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile -t hackalem-frontend:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e RUN_MIGRATIONS=false -e SEED_ON_START=false \
            hackalem-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "health check failed"; docker logs api; exit 1
