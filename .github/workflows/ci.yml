name: CI/CD

# Быстрый путь на каждый пуш: линтер + юнит-тесты (~1 мин), а на main ещё
# и деплой на демо-сервер. Долгие проверки (интеграционные, безопасность,
# сборка образов в раннере) вынесены в checks.yml и на пуш не запускаются.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_MODE: mock
      # Приложение на старте создаёт бакет в S3. В раннере MinIO нет, а
      # boto3 по умолчанию ретраит с бэкоффом: +24 с на тестах старта.
      S3_ENDPOINT: http://127.0.0.1:9
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv вместо pip: ML-стек (lightgbm, pandas, pyarrow) ставится за секунды
      # из кэша, а не за минуты.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,ml]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q -x -p no:cacheprovider

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Деплой не отменяется новым пушем посреди `compose up`, а встаёт в очередь.
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    environment:
      name: demo
      url: http://89.126.192.240:3000
    env:
      DEPLOY_HOST: 89.126.192.240
      DEPLOY_DIR: /opt/opentowork
    steps:
      - uses: actions/checkout@v4

      - name: SSH setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Ключ хоста закреплён, а не берётся ssh-keyscan: иначе подменённый
          # сервер молча получил бы код и доступ по ключу деплоя.
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHRN1X5XNVoj2wDZEQZwFmT7yvU3JPz9cBHi+m5+esdI" > ~/.ssh/known_hosts

      # .env и docker-compose.override.yml живут только на сервере:
      # первый — конфигурация стенда, второй закрывает БД/Redis/MinIO на localhost.
      - name: Sync code
        run: |
          rsync -az --delete \
            --exclude .git --exclude .github --exclude .env \
            --exclude docker-compose.override.yml \
            --exclude node_modules --exclude frontend/dist \
            --exclude artifacts/models/forecaster.pkl \
            ./ root@$DEPLOY_HOST:$DEPLOY_DIR/

      - name: Build and restart
        run: |
          ssh root@$DEPLOY_HOST bash -s <<EOF
          set -euo pipefail
          cd $DEPLOY_DIR
          docker compose up -d --build --remove-orphans
          for i in \$(seq 1 60); do
            api=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
            web=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "\$api" = 200 ] && [ "\$web" = 200 ]; then
              echo "healthy: api=\$api web=\$web"
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "health check failed: api=\$api web=\$web"
          docker compose ps
          docker compose logs --tail=80 api
          exit 1
          EOF
