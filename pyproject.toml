[project]
name = "hackalem-api"
version = "0.1.0"
description = "AI platform skeleton — HackAlem AI"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "boto3>=1.35",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.57"]
# ML-контур прогноза ВЭС (windcast): python -m pip install -e ".[ml]"
ml = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    # Проверки безопасности зависимостей и кода — часть CI, а не разовая акция.
    "pip-audit>=2.7",
    "bandit>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Интеграционные требуют базы, поэтому по умолчанию не запускаются:
# быстрый CI остаётся быстрым. Запуск: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: требует поднятой базы и Redis",
]
